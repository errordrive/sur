# Optional: nginx reverse proxy (only if you want a domain in front)
# Usage: sudo cp nginx-snippet.conf /etc/nginx/sites-available/sur
#        (edit server_name) && sudo ln -s .../sites-available/sur /etc/nginx/sites-enabled/
#        && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name music.example.com;   # <-- change to your subdomain

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
# Tip: easiest HTTPS = Cloudflare DNS (A record -> VPS IP) with proxy ON (orange cloud).
