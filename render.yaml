services:
  # Free-tier web service: Flask + ytmusicapi + yt-dlp, serves API + frontend.
  - type: web
    name: sur
    runtime: python
    plan: free
    buildCommand: >-
      curl -fsSLO https://nodejs.org/dist/v22.18.0/node-v22.18.0-linux-x64.tar.xz &&
      tar -xf node-v22.18.0-linux-x64.tar.xz &&
      rm node-v22.18.0-linux-x64.tar.xz &&
      mv node-v22.18.0-linux-x64 .node &&
      pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
