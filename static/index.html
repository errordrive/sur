<header class="appbar">
  <div class="brand" id="brandBtn">
    <svg class="brand-ic" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#f00"/><path d="M11 8.8v10.4L19.2 14z" fill="#fff"/></svg>
    <span class="brand-t">Sur</span>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="topSearch" aria-label="Search">
    <svg class="ic"><use href="#i-search"/></svg>
  </button>
</header>

<main id="view"></main>

<nav class="bottomnav" id="bottomnav">
  <button class="navbtn" data-tab="home"><svg class="ic"><use href="#i-home" id="nav-home-ic"/></svg><span>Home</span></button>
  <button class="navbtn" data-tab="explore"><svg class="ic"><use href="#i-explore-o" id="nav-explore-ic"/></svg><span>Explore</span></button>
  <button class="navbtn" data-tab="library"><svg class="ic"><use href="#i-library-o" id="nav-library-ic"/></svg><span>Library</span></button>
</nav>

<div id="mini">
  <div class="mprog"><i id="mProg"></i></div>
  <img id="mArt" src="" alt="">
  <div class="mid">
    <div class="t" id="mTitle">Not playing</div>
    <div class="s" id="mArtist">Pick a song</div>
  </div>
  <button class="iconbtn" id="mToggle" aria-label="Play/Pause"><svg class="ic"><use href="#i-play" id="mToggleIc"/></svg></button>
  <button class="iconbtn" id="mNext" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
</div>

<div id="player">
  <div class="p-top">
    <button class="iconbtn" id="pClose" aria-label="Collapse"><svg class="ic"><use href="#i-down"/></svg></button>
    <button class="iconbtn" id="pMore" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
  </div>
  <img class="p-art" id="pArt" src="" alt="">
  <div class="p-meta">
    <div class="p-text">
      <div class="p-title" id="pTitle">—</div>
      <div class="p-artist" id="pArtist">—</div>
    </div>
    <div class="p-rate">
      <button class="iconbtn" id="pDislike" aria-label="Dislike"><svg class="ic"><use href="#i-dislike-o" id="pDislikeIc"/></svg></button>
      <button class="iconbtn" id="pLike" aria-label="Like"><svg class="ic"><use href="#i-like-o" id="pLikeIc"/></svg></button>
    </div>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
  <div class="p-times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="p-controls">
    <button class="iconbtn dim" id="pShuffle" aria-label="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
    <button class="iconbtn" id="pPrev" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
    <button class="iconbtn p-play" id="pToggle" aria-label="Play/Pause"><svg class="ic big"><use href="#i-play" id="pToggleIc"/></svg></button>
    <button class="iconbtn" id="pNext" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
    <button class="iconbtn dim" id="pRepeat" aria-label="Repeat"><svg class="ic"><use href="#i-repeat" id="pRepeatIc"/></svg></button>
  </div>
  <div class="p-vol"><svg class="ic sm"><use href="#i-vol"/></svg><input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume"></div>
  <div class="p-tabs">
    <button class="ptab on" id="tabQueue">Up next</button>
    <button class="ptab" id="tabLyrics">Lyrics</button>
  </div>
  <div id="queueBox"></div>
  <div id="lyricsBox" class="hidden"></div>
</div>

<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
