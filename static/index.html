<link rel="stylesheet" href="style.css">
</head>

<header class="appbar">
  <button class="brand" id="brandBtn" aria-label="Sur home">
    <span class="brand-mark"><svg class="ic"><use href="#i-note"/></svg></span>
    <span class="brand-t">Sur</span>
  </button>
  <div class="spacer"></div>
  <button class="iconbtn" id="settingsBtn" aria-label="Settings">
    <svg class="ic"><use href="#i-gear"/></svg>
  </button>
</header>

<aside class="sidenav" aria-label="Primary">
  <button class="snavbtn" data-tab="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></button>
  <button class="snavbtn" data-tab="search"><svg class="ic"><use href="#i-search"/></svg><span>Search</span></button>
  <button class="snavbtn" data-tab="library"><svg class="ic"><use href="#i-library"/></svg><span>Library</span></button>
  <button class="snavbtn" data-tab="settings"><svg class="ic"><use href="#i-gear"/></svg><span>Settings</span></button>
  <div class="snav-foot">Sur v2</div>
</aside>

<main id="view" tabindex="-1"></main>

<div id="toasts" aria-live="polite"></div>

<div id="mini" role="button" tabindex="0" aria-label="Open player">
  <div class="mprog"><i id="mProg"></i></div>
  <img id="mArt" src="" alt="">
  <div class="mid">
    <div class="t" id="mTitle">Not playing</div>
    <div class="s" id="mArtist">Pick a song</div>
  </div>
  <button class="iconbtn" id="mToggle" aria-label="Play or pause"><svg class="ic"><use href="#i-play" id="mToggleIc"/></svg></button>
  <button class="iconbtn" id="mNext" aria-label="Next song"><svg class="ic"><use href="#i-next"/></svg></button>
</div>

<nav class="bottomnav" id="bottomnav" aria-label="Primary">
  <button class="navbtn" data-tab="home"><svg class="ic"><use href="#i-home" class="nav-ic"/></svg><span>Home</span></button>
  <button class="navbtn" data-tab="search"><svg class="ic"><use href="#i-search" class="nav-ic"/></svg><span>Search</span></button>
  <button class="navbtn" data-tab="library"><svg class="ic"><use href="#i-library" class="nav-ic"/></svg><span>Library</span></button>
</nav>

<div id="player" aria-hidden="true">
  <div class="p-bg"><img id="pBgArt" alt="" aria-hidden="true"></div>
  <div class="player-inner" id="playerInner">
    <div class="p-grab" id="pGrab">
      <span class="grab-pill"></span>
      <button class="iconbtn p-chev" id="pClose" aria-label="Collapse player"><svg class="ic"><use href="#i-down"/></svg></button>
    </div>
    <div class="p-stage">
      <img class="p-art" id="pArt" src="" alt="Album artwork">
    </div>
    <div class="p-meta">
      <div class="p-text">
        <div class="p-title" id="pTitle">—</div>
        <div class="p-artist" id="pArtist">—</div>
      </div>
      <div class="p-rate">
        <button class="iconbtn" id="pDislike" aria-label="Dislike"><svg class="ic"><use href="#i-dislike-o" id="pDislikeIc"/></svg></button>
        <button class="iconbtn" id="pLike" aria-label="Like"><svg class="ic"><use href="#i-like-o" id="pLikeIc"/></svg></button>
      </div>
    </div>
    <div class="seek" id="seek" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="seek-track"></div>
      <div class="seek-fill" id="seekFill"></div>
      <div class="seek-knob" id="seekKnob"></div>
    </div>
    <div class="p-times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="p-controls">
      <button class="iconbtn p-shuf" id="pShuffle" aria-label="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
      <button class="iconbtn" id="pPrev" aria-label="Previous song"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="iconbtn p-play" id="pToggle" aria-label="Play or pause"><svg class="ic big"><use href="#i-play" id="pToggleIc"/></svg></button>
      <button class="iconbtn" id="pNext" aria-label="Next song"><svg class="ic"><use href="#i-next"/></svg></button>
      <button class="iconbtn p-rep" id="pRepeat" aria-label="Repeat mode"><svg class="ic"><use href="#i-repeat" id="pRepeatIc"/></svg></button>
    </div>
    <div class="p-vol" id="volWrap"><svg class="ic sm"><use href="#i-vol"/></svg><input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume"></div>
    <div class="p-tabs" role="tablist">
      <button class="ptab on" id="tabQueue" role="tab">Up next</button>
      <button class="ptab" id="tabLyrics" role="tab">Lyrics</button>
    </div>
    <div class="p-panels">
      <div id="queueBox" role="tabpanel"></div>
      <div id="lyricsBox" class="hidden" role="tabpanel"></div>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
